name: Deploy AquaLog

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust remote host
        run: ssh-keyscan -p 2222 ccarvalho.net >> ~/.ssh/known_hosts

      - name: Ensure remote directory exists
        run: ssh -p 2222 ccarv978@ccarvalho.net "mkdir -p /home/ccarv978/public_html/labs/aquazen"

      - name: Publish AquaLog
        run: scp -P 2222 aqualog.html ccarv978@ccarvalho.net:/home/ccarv978/public_html/labs/aquazen/index.html
